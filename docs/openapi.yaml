openapi: 3.0.3
info:
  title: Training Platform API
  version: 1.0.0
  description: >-
    Backend for training management platform (providers, trainings, sessions,
    instructors, surveys, reports). Clean architecture: interface
    (controllers/routes) -> use-cases -> domain <- infrastructure.


    Input validation: every JSON request body and the query strings of the list
    endpoints are validated before they reach a controller. A malformed value
    (wrong type, too long for its column, an id outside the 32-bit integer
    range, a non-numeric limit) returns 400 with the ValidationError schema.
    Unknown body fields are ignored, and account emails are trimmed and
    lower-cased. Whether a field is required is decided by the use case, so its
    own error message applies. Database constraint violations (duplicates, blank
    names, invalid country codes, ...) return a specific message rather than an
    internal error.
servers:
  - url: http://localhost:{port}
    description: Local
    variables:
      port:
        default: "4000"
tags:
  - name: Auth
  - name: Providers
  - name: Trainings
  - name: Clients
  - name: Sessions
  - name: Instructors
  - name: Calendar
  - name: Survey
  - name: Reports
  - name: Admin
  - name: Push
  - name: Feedback
  - name: Announcements
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: httpOnly session cookie set by /auth/login, /auth/admin-login, or
        /auth/refresh. Not readable/settable from JavaScript or from this UI -
        authenticate via a real browser session with the API running behind the
        configured CLIENT_URL origin.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: For non-browser, server-to-server callers only (e.g. the n8n
        chatbot, which obtains one via GET /auth/service-token and forwards it
        on every call it makes on a user's behalf) - the browser frontend uses
        cookieAuth instead. Not subject to the CSRF check below, since a Bearer
        header is never attached automatically by a browser to a cross-site
        request the way a cookie is.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on POST/PUT/PATCH/DELETE. Value must match the
        non-httpOnly csrfToken cookie set alongside the session (double-submit
        pattern).
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the non-httpOnly csrfToken cookie set at login
        (double-submit pattern).
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials
    ValidationError:
      type: object
      description: Returned with HTTP 400 when a request body, query string or path
        identifier is malformed.
      properties:
        error:
          type: string
          example: "email: Invalid input: expected string, received object"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: "Invalid input: expected string, received object"
    Role:
      type: string
      enum:
        - Sales
        - Manager
        - Instructor
    UserStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - deactivated
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        firstname:
          type: string
          example: Jane
        lastname:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane@example.com
        roleId:
          type: integer
          example: 2
          description: FK into the roles table. The role name itself is intentionally not
            exposed here.
        status:
          $ref: "#/components/schemas/UserStatus"
        hasSeenTour:
          type: boolean
          description: Whether this account has already had the guided-tour dashboard
            auto-launch.
    Provider:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Red Hat
        description:
          type: string
          nullable: true
          example: Enterprise Linux
        logoUrl:
          type: string
          nullable: true
          example: https://example.com/redhat-logo.svg
        createdAt:
          type: string
          format: date-time
    Training:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: RHCSA
        providerId:
          type: integer
          example: 1
        providerName:
          type: string
          example: Red Hat
        description:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
          description: A count of days or hours - see durationUnit.
        durationUnit:
          allOf:
            - $ref: "#/components/schemas/TrainingDurationUnit"
          nullable: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    Client:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyName:
          type: string
          example: Acme Corp
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    SessionStatus:
      type: string
      enum:
        - scheduled
        - ongoing
        - completed
        - cancelled
    AssignmentStatus:
      type: string
      enum:
        - unassigned
        - pending
        - accepted
        - refused
    TrainingDurationUnit:
      type: string
      enum:
        - days
        - hours
    TrainingSession:
      type: object
      properties:
        id:
          type: integer
          example: 1
        trainingId:
          type: integer
        clientId:
          type: integer
        instructorId:
          type: integer
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        sessionStatus:
          $ref: "#/components/schemas/SessionStatus"
        assignmentStatus:
          $ref: "#/components/schemas/AssignmentStatus"
        includeWeekends:
          type: boolean
          description: Whether Saturday/Sunday count as real training days for this session.
        locationType:
          type: string
          enum:
            - onsite
            - remote
        teachingLanguage:
          type: string
          enum:
            - french
            - english
          description: The language the training will be delivered in.
        createdBy:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    SessionAttendee:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sessionId:
          type: integer
        name:
          type: string
          example: Alice Attendee
        email:
          type: string
          nullable: true
        surveySubmitted:
          type: boolean
        attendanceStatus:
          type: string
          enum:
            - pending
            - present
            - absent
    InstructorSkill:
      type: object
      properties:
        trainingId:
          type: integer
        trainingName:
          type: string
    Instructor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
        bio:
          type: string
          nullable: true
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/InstructorSkill"
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sessionId:
          type: integer
        eventDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        title:
          type: string
          example: RHCSA - Acme Corp
    SurveyQR:
      type: object
      properties:
        surveyUrl:
          type: string
          example: http://localhost:3000/survey/1
        qrCodeDataUrl:
          type: string
          description: PNG QR code as a data URL - drop straight into an <img src>.
          example: data:image/png;base64,iVBORw0KGgoAAAANSU...
    SurveyInfo:
      type: object
      properties:
        sessionId:
          type: integer
        trainingName:
          type: string
          nullable: true
        instructorName:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    Survey:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sessionId:
          type: integer
        instructorId:
          type: integer
          description: Filled server-side from the session - not client-supplied.
        attendeeId:
          type: integer
          nullable: true
        instructorScore:
          type: integer
          minimum: 0
          maximum: 5
          example: 4
        npsScore:
          type: integer
          minimum: 0
          maximum: 10
          description: NPS/global score.
          example: 9
        comments:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
    Report:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sessionId:
          type: integer
        pdfUrl:
          type: string
          nullable: true
          description: Not yet implemented - always null today.
        averageScore:
          type: string
          example: "4.00"
        npsAverage:
          type: string
          description: Net Promoter Score, as a percentage from -100 to 100 (%promoters -
            %detractors).
          example: "42.00"
        generatedAt:
          type: string
          format: date-time
    SessionNote:
      type: object
      description: A free-text note left by a session's assigned Instructor.
        Sales/Manager/SuperAdmin can view but not create/edit/delete these.
      properties:
        id:
          type: integer
          example: 1
        sessionId:
          type: integer
        instructorId:
          type: integer
        body:
          type: string
          example: Group struggled with chapter 3, plan a recap next session.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
          example: 1
        actorId:
          type: integer
        actorName:
          type: string
          example: Jane Doe
        actorDeleted:
          type: boolean
          description: True if the actor was a real user whose account has since been
            permanently deleted (actorId/actorName are null because of this, not
            because it was an automated/system action).
        action:
          type: string
          example: update
        entityType:
          type: string
          example: Provider
        entityId:
          type: integer
        before:
          type: object
          nullable: true
          description: Entity state before the change, or null for a create.
        after:
          type: object
          nullable: true
          description: Entity state after the change, or null for a delete.
        createdAt:
          type: string
          format: date-time
    PushSubscription:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
        endpoint:
          type: string
          example: https://fcm.googleapis.com/fcm/send/...
        p256dh:
          type: string
        auth:
          type: string
        createdAt:
          type: string
          format: date-time
    AdminSessionOverview:
      type: object
      description: Denormalized session view for the SuperAdmin dashboard - joins in
        names instead of just FK ids.
      properties:
        id:
          type: integer
          example: 1
        trainingId:
          type: integer
        trainingName:
          type: string
        clientId:
          type: integer
        clientCompanyName:
          type: string
        instructorId:
          type: integer
          nullable: true
        instructorName:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        sessionStatus:
          $ref: "#/components/schemas/SessionStatus"
        assignmentStatus:
          $ref: "#/components/schemas/AssignmentStatus"
        createdBy:
          type: integer
          nullable: true
        creatorName:
          type: string
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        attendeeCount:
          type: integer
        attendeeSurveysSubmitted:
          type: integer
        hasReport:
          type: boolean
    FeedbackReport:
      type: object
      description: A bug report / enhancement idea / other message submitted to the
        Developer, with the submitter joined in.
      properties:
        id:
          type: integer
          example: 1
        submittedBy:
          type: integer
        submitterName:
          type: string
          example: Jane Doe
        submitterEmail:
          type: string
          example: jane.doe@example.com
        submitterRole:
          type: string
          example: Sales
        category:
          type: string
          enum:
            - bug
            - enhancement
            - other
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    FeatureAnnouncement:
      type: object
      description: A feature/enhancement published by the Developer to one or more roles.
      properties:
        id:
          type: integer
          example: 1
        createdBy:
          type: integer
        title:
          type: string
        description:
          type: string
        targetRoles:
          type: array
          items:
            type: string
            enum:
              - Sales
              - Manager
              - Instructor
              - SuperAdmin
        createdAt:
          type: string
          format: date-time
    FeatureAnnouncementWithRatings:
      allOf:
        - $ref: "#/components/schemas/FeatureAnnouncement"
        - type: object
          properties:
            overallAverageStars:
              type: number
              nullable: true
              example: 4.25
            overallRatingCount:
              type: integer
              example: 8
            byRole:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    example: Sales
                  averageStars:
                    type: number
                    example: 4.5
                  ratingCount:
                    type: integer
                    example: 4
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /admin/users:
    get:
      tags:
        - Admin
      summary: List every user, any status
      description: SuperAdmin only. Unlike GET /auth/users/pending, includes
        approved/rejected/deactivated users too.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Not a SuperAdmin
  /admin/users/{id}:
    patch:
      tags:
        - Admin
      summary: Edit another user's profile, role, or status
      description: SuperAdmin only. Refuses to change the role or status of the last
        remaining active SuperAdmin, to avoid locking everyone out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum:
                    - Sales
                    - Manager
                    - Instructor
                    - SuperAdmin
                status:
                  $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error, user not found, or would leave zero active
            SuperAdmins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a SuperAdmin
    delete:
      tags:
        - Admin
      summary: Deactivate a user
      description: SuperAdmin only. Soft delete (status becomes "deactivated") - also
        revokes every refresh token the user currently holds. Refuses to
        deactivate the last remaining active SuperAdmin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: User not found, already deactivated, or is the last remaining
            active SuperAdmin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a SuperAdmin
  /admin/users/{id}/purge:
    delete:
      tags:
        - Admin
      summary: Permanently delete a user
      description: >
        SuperAdmin only. Irreversible - unlike DELETE /admin/users/{id} (which
        only deactivates), this removes the account row entirely. Requires the
        account to already be deactivated first, and refuses to target the
        requester's own account.
        Trainings/sessions/providers/clients/feedback/announcements this user
        created are kept, just detached (created_by/submitted_by becomes null) -
        business records aren't deleted. If they were an assigned Instructor,
        sessions/surveys referencing them are unassigned (instructor_id becomes
        null), not deleted. This user's audit log footprint is anonymized rather
        than deleted: entries where they were the actor now show as from a
        deleted user instead of System, and entries about their own account
        (signup, approval, edits) have their name/email scrubbed - the audit
        trail itself is preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  deleted:
                    type: boolean
        "400":
          description: User not found, not yet deactivated, or is the requester's own
            account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a SuperAdmin
  /admin/users/{id}/send-password-reset:
    post:
      tags:
        - Admin
      summary: Email a password reset link for another user's account
      description: >
        SuperAdmin only, and cannot target another SuperAdmin account. Sends a
        single-use, short-lived reset link to the account's own email and
        immediately revokes every refresh token that account currently holds,
        signing out any active sessions as a precaution. No password is ever
        generated or transmitted by this endpoint - the emailed link only lets
        the recipient set their own new one, via POST /auth/reset-password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK - email sent
        "400":
          description: User not found, target is a SuperAdmin, or the email failed to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a SuperAdmin
  /admin/sessions:
    get:
      tags:
        - Admin
      summary: Full training-session overview with training/client/instructor/creator
        names and attendee counts
      description: SuperAdmin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSessionOverview"
        "403":
          description: Not a SuperAdmin
  /admin/audit-log:
    get:
      tags:
        - Admin
      summary: List audit log entries
      description: Manager or SuperAdmin. A Manager never sees entityType=User entries
        (and gets a 400 if they explicitly filter for them) - only a SuperAdmin
        can view changes made to user accounts. Capped at the 200 most recent
        entries.
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            type: string
          example: Provider
        - name: entityId
          in: query
          required: false
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries created at or after this instant
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only entries created at or before this instant
        - name: roleName
          in: query
          required: false
          schema:
            type: string
            enum:
              - Sales
              - Manager
              - Instructor
              - SuperAdmin
          description: Only entries whose actor holds this role
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "400":
          description: A Manager explicitly filtered for entityType=User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a Manager or SuperAdmin
  /announcements:
    post:
      tags:
        - Announcements
      summary: Publish a feature announcement to one or more roles
      description: >
        Developer only. Publishes immediately - there is no draft state.
        targetRoles can be any of Sales, Manager, Instructor, SuperAdmin (never
        Developer itself).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - targetRoles
              properties:
                title:
                  type: string
                description:
                  type: string
                targetRoles:
                  type: array
                  items:
                    type: string
                    enum:
                      - Sales
                      - Manager
                      - Instructor
                      - SuperAdmin
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureAnnouncement"
        "400":
          description: Missing title/description, or targetRoles empty/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Developer
    get:
      tags:
        - Announcements
      summary: List every published announcement, with its star ratings
      description: >
        Developer only. Each entry includes an overall average + rating count,
        plus a per-role breakdown (average and count for each role that has
        actually rated it so far).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureAnnouncementWithRatings"
        "403":
          description: Not Developer
  /announcements/mine:
    get:
      tags:
        - Announcements
      summary: List announcements targeted at my role that I have not rated yet
      description: >
        Sales, Manager, Instructor, or SuperAdmin only. Oldest first, and only
        announcements published since my account was created - a brand-new
        account is never handed a backlog of everything the role has ever been
        sent. Drives the mandatory-rating popup.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureAnnouncement"
  /announcements/{id}/rate:
    patch:
      tags:
        - Announcements
      summary: Rate a feature announcement 1-5 stars
      description: >
        Sales, Manager, Instructor, or SuperAdmin only, and only for an
        announcement actually targeted at my role. Idempotent - rating the same
        announcement again updates the existing rating rather than creating a
        second one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stars
              properties:
                stars:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: OK
        "400":
          description: stars out of range, announcement not found, or not targeted at my
            role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Create an account (Sales, Manager, or Instructor)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstname
                - lastname
                - email
                - password
                - role
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: Account created, status is "pending" until a Manager approves it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in (Sales, Manager, Instructor) and receive an httpOnly session
      description: >
        SuperAdmin accounts cannot log in through this endpoint - a SuperAdmin's
        correct password is rejected with the exact same "Invalid credentials"
        message a wrong password would produce, so the response never reveals
        that an email belongs to a SuperAdmin. Use /auth/admin-login instead. On
        success, sets three cookies: httpOnly accessToken, httpOnly refreshToken
        (scoped to /auth), and a JS-readable csrfToken. No tokens are returned
        in the response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: OK. Session cookies set via Set-Cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials, SuperAdmin account, pending, or rejected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
  /auth/admin-login:
    post:
      tags:
        - Auth
      summary: Log in as SuperAdmin
      description: >
        Only succeeds for SuperAdmin accounts - a correct password for a
        non-SuperAdmin account is rejected with the same "Invalid credentials"
        message a wrong password would produce. Subject to a much stricter,
        dedicated rate limit than /auth/login. Sets the same session cookies as
        /auth/login on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: OK. Session cookies set via Set-Cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials, non-SuperAdmin account, pending, or rejected
            account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (much lower threshold than /auth/login)
  /auth/developer-login:
    post:
      tags:
        - Auth
      summary: Log in as Developer
      description: >
        Only succeeds for Developer accounts - a correct password for a
        non-Developer account is rejected with the same "Invalid credentials"
        message a wrong password would produce. Subject to a much stricter,
        dedicated rate limit than /auth/login. Sets the same session cookies as
        /auth/login on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: OK. Session cookies set via Set-Cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials, non-Developer account, pending, or rejected
            account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (much lower threshold than /auth/login)
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate the session using the httpOnly refreshToken cookie
      description: >
        Reads the refreshToken from its httpOnly cookie (not the request body).
        The presented refresh token is revoked immediately, whether or not the
        call succeeds after that point. Requires a valid X-CSRF-Token header
        (checked explicitly here since this route runs before/without
        authMiddleware, by design, so an already-expired access token doesn't
        block refreshing).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: OK. New session cookies set via Set-Cookie.
        "401":
          description: Invalid, expired, or already-used refresh token
        "403":
          description: Missing/invalid CSRF token
        "429":
          description: Rate limited
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      description: Reads the refreshToken from its httpOnly cookie and revokes it,
        then clears all session cookies.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Always succeeds if authenticated, even if the token was already
            invalid (doesn't leak validity)
        "401":
          description: Missing/invalid access token
        "403":
          description: Missing/invalid CSRF token
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the currently authenticated user
      description: Used by the frontend on load to bootstrap session state from the
        httpOnly cookie (no tokens are readable client-side).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Missing/invalid access token
    patch:
      tags:
        - Auth
      summary: Update my own profile (firstname/lastname), or mark the guided tour as
        seen
      description: >
        Response body is the updated User object directly, not wrapped in { user
        }, unlike GET /auth/me. Passing hasSeenTour: true (typically fired the
        moment the dashboard auto-launches its guided tour) does not create an
        audit-log entry - only firstname/lastname edits do.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                hasSeenTour:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing/invalid access token
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Complete a password reset using the token from a reset email
      description: >
        Public - the token (not a session) is what authorizes this call, exactly
        like the survey-submission flow is authorized by knowing a session ID
        rather than logging in. Single-use: the token is consumed the moment
        this succeeds, whether or not it was already close to expiring. Revokes
        every refresh token the account holds and sends a confirmation email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
                  description: At least 10 characters, with at least one letter and one number.
      responses:
        "200":
          description: OK
        "400":
          description: Token invalid/expired/already used, or newPassword too weak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
  /auth/me/password:
    patch:
      tags:
        - Auth
      summary: Change my own password
      description: >
        Requires the current password even though the caller is already
        authenticated, so a hijacked-but-idle session can't silently take over
        the account. On success, every OTHER session for this account is signed
        out (a fresh session is issued for the device that made this call, via
        updated Set-Cookie headers) and a confirmation email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  description: At least 10 characters, with at least one letter and one number.
                    Must differ from currentPassword.
      responses:
        "200":
          description: OK. New session cookies set via Set-Cookie.
        "400":
          description: Current password incorrect, newPassword too weak, or newPassword
            equals currentPassword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid access token
        "429":
          description: Rate limited
  /auth/service-token:
    get:
      tags:
        - Auth
      summary: Mint a short-lived bearer token for cross-origin service calls
      description: >
        The main session lives entirely in the httpOnly accessToken cookie,
        which by design a cross-origin service (e.g. the chatbot's n8n webhook
        host) never receives. This returns an ordinary bearer JWT, identical in
        shape/expiry to the cookie's, meant to be used immediately and held only
        in memory client-side (never persisted to localStorage) for that one
        cross-origin call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Missing/invalid access token
  /auth/roles:
    get:
      tags:
        - Auth
      summary: List roles (id + name)
      description: >
        User responses expose roleId, not a role name string (see the User
        schema) - use this to resolve a roleId back to a display name. Ids are
        whatever the roles table actually assigned them; do not assume a fixed
        1..4 sequence.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    name:
                      type: string
                      enum:
                        - Sales
                        - Manager
                        - Instructor
                        - SuperAdmin
                      example: Manager
        "401":
          description: Missing/invalid access token
  /auth/users/pending:
    get:
      tags:
        - Auth
      summary: List users awaiting approval
      description: Manager only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
        "403":
          description: Not a Manager
  /auth/users/{id}/approve:
    post:
      tags:
        - Auth
      summary: Approve a pending user
      description: Manager only. Sends an approval email and points the user to the
        login page.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Not a Manager
  /auth/users/{id}/reject:
    post:
      tags:
        - Auth
      summary: Reject a pending user
      description: Manager only. Also revokes every refresh token the user currently holds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Not a Manager
  /calendar/global:
    get:
      tags:
        - Calendar
      summary: List the global calendar
      description: Sales or Manager only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "403":
          description: Not Sales or Manager
  /calendar/global/{id}:
    patch:
      tags:
        - Calendar
      summary: Update a global calendar event
      description: Sales or Manager only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                title:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "403":
