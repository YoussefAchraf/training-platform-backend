      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /providers:
    get:
      tags:
        - Providers
      summary: List all providers (e.g. Red Hat, Linux Foundation, CompTIA, SUSE,
        Oracle)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      tags:
        - Providers
      summary: Add a provider
      description: Sales or Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Red Hat
                description:
                  type: string
                logoUrl:
                  type: string
                  example: https://example.com/redhat-logo.svg
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /providers/{id}:
    patch:
      tags:
        - Providers
      summary: Update a provider
      description: Sales or Manager only, and only for a provider you created
        (SuperAdmin can update any).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                logoUrl:
                  type: string
                  example: https://example.com/redhat-logo.svg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error, provider not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
    delete:
      tags:
        - Providers
      summary: Delete a provider
      description: Sales or Manager only, and only for a provider you created
        (SuperAdmin can delete any). Soft delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Provider not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /push/subscribe:
    post:
      tags:
        - Push
      summary: Register a browser push subscription for the current user
      description: "Best-effort: also immediately sends a confirmation push
        notification; a failure there does not fail the request."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - keys
              properties:
                endpoint:
                  type: string
                  example: https://fcm.googleapis.com/fcm/send/...
                keys:
                  type: object
                  required:
                    - p256dh
                    - auth
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                silent:
                  type: boolean
                  description: Skip the "Notifications enabled" confirmation push - set by the
                    frontend when this call is reconciling an already-known
                    subscription (e.g. on every app load) rather than a genuine
                    first-time opt-in.
                  default: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          description: endpoint or keys missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /push/unsubscribe:
    post:
      tags:
        - Push
      summary: Remove a browser push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unsubscribed
        "400":
          description: endpoint missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}:
    get:
      tags:
        - Reports
      summary: Get a session's report
      description: Sales, Manager, or Instructor.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No report yet for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}/pdf:
    get:
      tags:
        - Reports
      summary: Download a session's report as a PDF
      description: Sales, Manager, or Instructor.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not yet generated for this session, or session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}/generate:
    post:
      tags:
        - Reports
      summary: Manually trigger report generation for a session
      description: >
        Sales or Manager only. Normally unnecessary - a report auto-generates
        once every attendee submits a survey, or via the scheduled job
        REPORT_AUTO_GENERATE_AFTER_MINUTES after the session ends (default 60
        minutes).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "403":
          description: Not Sales or Manager
  /sessions:
    get:
      tags:
        - Sessions
      summary: List training sessions
      description: Sales/Manager see every session; an Instructor sees only sessions
        assigned to them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      tags:
        - Sessions
      summary: Create a training session
      description: >
        Sales, Manager, or SuperAdmin only. Also creates the matching global
        calendar entry. includeWeekends (default false) is only meaningful for a
        multi-day session - it records whether Saturday/Sunday count as real
        training days, so the calendar can correctly show the session as
        occupying (or skipping) those days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trainingId
                - clientId
                - startDate
                - endDate
              properties:
                trainingId:
                  type: integer
                clientId:
                  type: integer
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                includeWeekends:
                  type: boolean
                  default: false
                locationType:
                  type: string
                  enum:
                    - onsite
                    - remote
                  default: onsite
                teachingLanguage:
                  type: string
                  enum:
                    - french
                    - english
                  default: french
                  description: The language the training will be delivered in.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Validation error, or endDate not after startDate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales, Manager, or SuperAdmin
  /sessions/{id}:
    patch:
      tags:
        - Sessions
      summary: Update a training session (dates only)
      description: >
        Sales, Manager, or SuperAdmin only, and only for a session you created
        (SuperAdmin can update any). Rejected once the session already has a
        survey or report attached. includeWeekends follows the same meaning as
        on POST /sessions - update it here too if a reschedule changes whether
        the session should span weekends.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                includeWeekends:
                  type: boolean
                locationType:
                  type: string
                  enum:
                    - onsite
                    - remote
                teachingLanguage:
                  type: string
                  enum:
                    - french
                    - english
                  description: The language the training will be delivered in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Session not found, not the creator, endDate not after startDate, or
            the session already has a survey/report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /sessions/{id}/cancel:
    post:
      tags:
        - Sessions
      summary: Cancel a training session
      description: Sales or Manager only, and only for a session you created
        (SuperAdmin can cancel any). Rejected if already cancelled, or if the
        session already has a survey or report attached.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Session not found, not the creator, already cancelled, or the
            session already has a survey/report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /sessions/{id}/assign-instructor:
    post:
      tags:
        - Sessions
      summary: Assign a session to an instructor
      description: Manager only (Sales cannot). The session must already have at least
        one attendee. Assignment is immediate and final (assignmentStatus is set
        straight to "accepted" - there is no accept/refuse step). Rejected if
        the instructor is already assigned to a different session at the exact
        same start time (a different start time on the same day is fine).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructorId
              properties:
                instructorId:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: No attendees yet, instructor not found/not approved/not qualified,
            or already engaged in another session at the same start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a Manager
  /sessions/{id}/attendees:
    post:
      tags:
        - Sessions
      summary: Add an attendee to a session
      description: Sales, Manager, or SuperAdmin only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendee"
        "403":
          description: Not Sales, Manager, or SuperAdmin
    get:
      tags:
        - Sessions
      summary: List a session's attendees
      description: >
        Sales/Manager/SuperAdmin can view any session's attendees; an Instructor
        can only view attendees of a session assigned to them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionAttendee"
        "400":
          description: Not allowed to view this session's attendees, or the session does
            not exist
  /sessions/{id}/attendees/import:
    post:
      tags:
        - Sessions
      summary: Bulk-import attendees from a spreadsheet
      description: 'Sales, Manager, or SuperAdmin only. Upload a .xlsx or .csv file
        with a header row containing a "Name" column and an optional "Email"
        column. Rows are imported best-effort: a row is skipped (with a reason)
        rather than failing the whole file if the name is missing, the email is
        invalid, the email is duplicated within the file, or the attendee is
        already registered in a different session that overlaps this one in
        time.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  importedCount:
                    type: integer
                  skippedCount:
                    type: integer
                  attendees:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionAttendee"
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                        name:
                          type: string
                          nullable: true
                        email:
                          type: string
                          nullable: true
                        reason:
                          type: string
        "400":
          description: No file uploaded, unsupported file type, unreadable file, or
            session does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales, Manager, or SuperAdmin
  /sessions/{id}/attendees/{attendeeId}/attendance:
    patch:
      tags:
        - Sessions
      summary: Mark an attendee's attendance
      description: Only the session's assigned Instructor can mark an attendee Present
        or Absent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - present
                    - absent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendee"
        "400":
          description: Invalid status, session/attendee not found, or attendee does not
            belong to this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the assigned Instructor
  /sessions/{id}/attendees/{attendeeId}:
    patch:
      tags:
        - Sessions
      summary: Edit an attendee's name/email
      description: >
        Sales, Manager, or SuperAdmin only. Locked once the session's attendance
        has started being marked - callers should stop offering this once any
        attendee on the session has a non-pending attendanceStatus, though the
        backend itself doesn't separately enforce that (there's nothing wrong
        with fixing a typo after the fact via the API).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendee"
        "400":
          description: Invalid name/email, session/attendee not found, attendee does not
            belong to this session, or the new email overlaps another session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales, Manager, or SuperAdmin
    delete:
      tags:
        - Sessions
      summary: Remove an attendee from a session
      description: >
        Sales, Manager, or SuperAdmin only. Rejected if the attendee has already
        submitted a survey (their response would be left pointing at a deleted
        attendee). Same as editing, callers should stop offering this once the
        session's attendance has started being marked, though the backend itself
        doesn't separately enforce that.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Session/attendee not found, attendee does not belong to this
            session, or the attendee already submitted a survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales, Manager, or SuperAdmin
  /sessions/{id}/notes:
    post:
      tags:
        - Sessions
      summary: Add a note to a session
      description: Only the session's assigned Instructor can add a note.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          description: Session not found, empty/too-long note body, or requester is not
            the assigned Instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Sessions
      summary: List a session's notes
      description: >
        Sales/Manager/SuperAdmin can view any session's notes (read-only); the
        assigned Instructor can view (and manage) their own session's notes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionNote"
        "400":
          description: Not allowed to view this session's notes, or the session does not
            exist
  /sessions/{id}/notes/{noteId}:
    patch:
      tags:
        - Sessions
      summary: Edit a session note
      description: Only the note's author (the assigned Instructor) can edit it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          description: Note/session not found, empty/too-long note body, or requester is
            not the note author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Sessions
      summary: Delete a session note
      description: Only the note's author (the assigned Instructor) can delete it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: noteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Note/session not found, or requester is not the note author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /survey/{sessionId}/qr-code:
    get:
      tags:
        - Survey
      summary: Generate the survey QR code for a session
      description: Instructor only, and only for their own session. Returns a PNG data
        URL pointing to the public survey form.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyQR"
        "400":
          description: Not this instructor's session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an Instructor
  /survey/{sessionId}/form:
    get:
      tags:
        - Survey
      summary: Get the info an attendee sees before rating (what the QR code links to)
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyInfo"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /survey/{sessionId}/submit:
    post:
      tags:
        - Survey
      summary: Submit a survey response
      description: >
        Public - no auth (attendees aren't logged-in users). sessionId comes
        from the path and instructorId is filled in server-side from the
        session, so neither can be spoofed by the client. Auto-triggers report
        generation once every attendee on the session has submitted.
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructorScore
                - npsScore
              properties:
                attendeeId:
                  type: integer
                  nullable: true
                instructorScore:
                  type: integer
                  minimum: 0
                  maximum: 5
                npsScore:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: Global/NPS score.
                comments:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          description: Session not found, no instructor assigned yet, or score out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trainings:
    get:
      tags:
        - Trainings
      summary: List trainings (e.g. RHCSA), optionally filtered by provider
      parameters:
        - name: providerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Training"
    post:
      tags:
        - Trainings
      summary: Create a training under a provider
      description: Sales or Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - providerId
              properties:
                name:
                  type: string
                  example: RHCSA
                providerId:
                  type: integer
                description:
                  type: string
                duration:
                  type: integer
                  description: A count of days or hours - see durationUnit.
                durationUnit:
                  $ref: "#/components/schemas/TrainingDurationUnit"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Training"
        "400":
          description: Validation error or provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /trainings/{id}:
    patch:
      tags:
        - Trainings
      summary: Update a training
      description: Sales or Manager only, and only for a training you created
        (SuperAdmin can update any).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                duration:
                  type: integer
                  description: A count of days or hours - see durationUnit.
                durationUnit:
                  $ref: "#/components/schemas/TrainingDurationUnit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Training"
        "400":
          description: Validation error, training not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
    delete:
      tags:
        - Trainings
      summary: Delete a training
      description: Sales or Manager only, and only for a training you created
        (SuperAdmin can delete any). Soft delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Training not found, or not the creator
