  /push/subscribe:
    post:
      tags:
        - Push
      summary: Register a browser push subscription for the current user
      description: "Best-effort: also immediately sends a confirmation push
        notification; a failure there does not fail the request."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - keys
              properties:
                endpoint:
                  type: string
                  example: https://fcm.googleapis.com/fcm/send/...
                keys:
                  type: object
                  required:
                    - p256dh
                    - auth
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          description: endpoint or keys missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /push/unsubscribe:
    post:
      tags:
        - Push
      summary: Remove a browser push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unsubscribed
        "400":
          description: endpoint missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}:
    get:
      tags:
        - Reports
      summary: Get a session's report
      description: Sales, Manager, or Instructor.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No report yet for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}/pdf:
    get:
      tags:
        - Reports
      summary: Download a session's report as a PDF
      description: Sales, Manager, or Instructor.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not yet generated for this session, or session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{sessionId}/generate:
    post:
      tags:
        - Reports
      summary: Manually trigger report generation for a session
      description: >
        Sales or Manager only. Normally unnecessary - a report auto-generates
        once every attendee submits a survey, or via the scheduled job
        REPORT_AUTO_GENERATE_AFTER_MINUTES after the session ends (default 60
        minutes).
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "403":
          description: Not Sales or Manager
  /sessions:
    get:
      tags:
        - Sessions
      summary: List training sessions
      description: Sales/Manager see every session; an Instructor sees only sessions
        assigned to them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      tags:
        - Sessions
      summary: Create a training session
      description: Sales or Manager only. Also creates the matching global calendar entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trainingId
                - clientId
                - startDate
                - endDate
              properties:
                trainingId:
                  type: integer
                clientId:
                  type: integer
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Validation error, or endDate not after startDate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /sessions/{id}:
    patch:
      tags:
        - Sessions
      summary: Update a training session (dates only)
      description: Sales or Manager only, and only for a session you created
        (SuperAdmin can update any). Rejected once the session already has a
        survey or report attached.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Session not found, not the creator, endDate not after startDate, or
            the session already has a survey/report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /sessions/{id}/cancel:
    post:
      tags:
        - Sessions
      summary: Cancel a training session
      description: Sales or Manager only, and only for a session you created
        (SuperAdmin can cancel any). Rejected if already cancelled, or if the
        session already has a survey or report attached.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Session not found, not the creator, already cancelled, or the
            session already has a survey/report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /sessions/{id}/assign-instructor:
    post:
      tags:
        - Sessions
      summary: Assign a session to an instructor
      description: Manager only (Sales cannot). Resets assignmentStatus to "pending"
        so the instructor can accept/refuse.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructorId
              properties:
                instructorId:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "403":
          description: Not a Manager
  /sessions/{id}/respond:
    post:
      tags:
        - Sessions
      summary: Accept or refuse an assigned session
      description: Instructor only, and only for a session assigned to them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accept
                    - refuse
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Session not assigned to this instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an Instructor
  /sessions/{id}/attendees:
    post:
      tags:
        - Sessions
      summary: Add an attendee to a session
      description: Sales or Manager only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendee"
        "403":
          description: Not Sales or Manager
    get:
      tags:
        - Sessions
      summary: List a session's attendees
      description: >
        Sales/Manager can view any session's attendees; an Instructor can only
        view attendees of a session assigned to them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionAttendee"
        "400":
          description: Not allowed to view this session's attendees, or the session does
            not exist
  /survey/{sessionId}/qr-code:
    get:
      tags:
        - Survey
      summary: Generate the survey QR code for a session
      description: Instructor only, and only for their own session. Returns a PNG data
        URL pointing to the public survey form.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyQR"
        "400":
          description: Not this instructor's session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an Instructor
  /survey/{sessionId}/form:
    get:
      tags:
        - Survey
      summary: Get the info an attendee sees before rating (what the QR code links to)
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyInfo"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /survey/{sessionId}/submit:
    post:
      tags:
        - Survey
      summary: Submit a survey response
      description: >
        Public - no auth (attendees aren't logged-in users). sessionId comes
        from the path and instructorId is filled in server-side from the
        session, so neither can be spoofed by the client. Auto-triggers report
        generation once every attendee on the session has submitted.
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - instructorScore
                - npsScore
              properties:
                attendeeId:
                  type: integer
                  nullable: true
                instructorScore:
                  type: integer
                  minimum: 0
                  maximum: 5
                npsScore:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: Global/NPS score.
                comments:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "400":
          description: Session not found, no instructor assigned yet, or score out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /trainings:
