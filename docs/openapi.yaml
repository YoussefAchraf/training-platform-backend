      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Training not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
