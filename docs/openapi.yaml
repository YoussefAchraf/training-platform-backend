        "200":
          description: OK
        "403":
          description: Not Sales or Manager
  /calendar/mine:
    get:
      tags:
        - Calendar
      summary: List my own calendar
      description: Instructor only. Read-only, pre-filtered to sessions assigned to
        this instructor.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "403":
          description: Not an Instructor
  /clients:
    get:
      tags:
        - Clients
      summary: List clients
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      tags:
        - Clients
      summary: Add a client
      description: Sales or Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - companyName
              properties:
                companyName:
                  type: string
                  example: Acme Corp
                email:
                  type: string
                phone:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /clients/{id}:
    patch:
      tags:
        - Clients
      summary: Update a client
      description: Sales or Manager only, and only for a client you created
        (SuperAdmin can update any).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error, client not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
    delete:
      tags:
        - Clients
      summary: Delete a client
      description: Sales or Manager only, and only for a client you created
        (SuperAdmin can delete any). Soft delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Client not found, or not the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales or Manager
  /feedback:
    post:
      tags:
        - Feedback
      summary: Submit a feedback report to the Developer
      description: Sales, Manager, Instructor, or SuperAdmin only - Developer accounts
        have no reason to submit feedback to themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - message
              properties:
                category:
                  type: string
                  enum:
                    - bug
                    - enhancement
                    - other
                message:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
        "400":
          description: Invalid category or missing message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not Sales, Manager, Instructor, or SuperAdmin
    get:
      tags:
        - Feedback
      summary: List every feedback report ever submitted
      description: Developer only. Newest first, with the submitter's name, email, and
        role already joined in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackReport"
        "403":
          description: Not Developer
  /instructors:
    get:
      tags:
        - Instructors
      summary: List instructor profiles
      description: Sales or Manager only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"
        "403":
          description: Not Sales or Manager
  /instructors/me:
    get:
      tags:
        - Instructors
      summary: Get my own instructor profile
      description: Instructor only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "403":
          description: Not an Instructor
    patch:
      tags:
        - Instructors
      summary: Update my own instructor profile (bio, trainings I can deliver)
      description: Instructor only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                skills:
                  type: array
                  description: Full replacement list of trainings this instructor can deliver.
                  items:
                    type: object
                    required:
                      - trainingId
                    properties:
                      trainingId:
                        type: integer
                      certificateId:
                        type: string
                        nullable: true
                      certificateExpiresAt:
                        type: string
                        format: date
                        nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "403":
          description: Not an Instructor
  /instructors/{id}:
    patch:
      tags:
        - Instructors
      summary: Update another instructor's profile
      description: Manager only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                skills:
                  type: array
                  items:
                    type: object
                    required:
                      - trainingId
                    properties:
                      trainingId:
                        type: integer
                      certificateId:
                        type: string
                        nullable: true
                      certificateExpiresAt:
                        type: string
                        format: date
                        nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "403":
          description: Not a Manager
  /messaging/directory:
    get:
      tags:
        - Messaging
      summary: List people reachable for messaging (Manager/Instructor only,
        SuperAdmin never included)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
  /messaging/conversations:
    get:
      tags:
        - Messaging
      summary: List my conversations, most recent activity first
      responses:
        "200":
          description: OK
  /messaging/conversations/direct:
    post:
      tags:
        - Messaging
      summary: Start (or reuse) a 1:1 conversation with another user
      responses:
        "201":
          description: Created
  /messaging/conversations/group:
    post:
      tags:
        - Messaging
      summary: Create a group conversation (Manager only)
      responses:
        "201":
          description: Created
  /messaging/conversations/{id}/participants:
    post:
      tags:
        - Messaging
      summary: Add a participant to a group (group owner only)
      responses:
        "201":
          description: Created
  /messaging/conversations/{id}/participants/{userId}:
    delete:
      tags:
        - Messaging
      summary: Remove a participant from a group (group owner only)
      responses:
        "204":
          description: Deleted
  /messaging/conversations/{id}/read:
    post:
      tags:
        - Messaging
      summary: Mark a conversation read up to a given message id
      responses:
        "200":
          description: OK
  /messaging/conversations/{id}/hide:
    post:
      tags:
        - Messaging
      summary: Hide a conversation from my own list only (non-destructive - reappears
        if messaged again)
      responses:
        "200":
          description: OK
  /messaging/conversations/{id}/mute:
    post:
      tags:
        - Messaging
      summary: Mute or unmute a conversation for myself only
      responses:
        "200":
          description: OK
  /messaging/conversations/{id}/messages:
    get:
      tags:
        - Messaging
      summary: List messages in a conversation (keyset paginated, optionally filtered
        by a text search)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
    post:
      tags:
        - Messaging
      summary: Send a message (multipart/form-data with a `file` field for
        image/voice/file types)
      responses:
        "201":
          description: Created
  /messaging/conversations/{id}/media:
    get:
      tags:
        - Messaging
      summary: List a conversation's media, files, or links (keyset paginated)
      parameters:
        - name: filter
          in: query
          required: true
          schema:
            type: string
            enum:
              - media
              - files
              - links
      responses:
        "200":
          description: OK
  /messaging/conversations/{id}/uploads:
    post:
      tags:
        - Messaging
      summary: Initiate a chunked attachment upload, returning an uploadId, chunkSize,
        and chunkCount
      responses:
        "201":
          description: Created
  /messaging/uploads/{uploadId}/chunks/{index}:
    put:
      tags:
        - Messaging
      summary: Upload one chunk of a file (raw binary body)
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /messaging/uploads/{uploadId}/complete:
    post:
      tags:
        - Messaging
      summary: Complete a chunked upload once every chunk has been received, sending
        the resulting message
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created
  /messaging/uploads/{uploadId}:
    delete:
      tags:
        - Messaging
      summary: Abort a chunked upload and discard any chunks already received
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /messaging/uploads/{uploadId}/status:
    get:
      tags:
        - Messaging
      summary: Get which chunks of an in-progress upload have already been received
        (for resuming)
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /messaging/attachments/{messageId}:
    get:
      tags:
        - Messaging
      summary: Download a message's attachment (participants of that conversation only)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /messaging/messages/{messageId}/translate:
    post:
      tags:
        - Messaging
      summary: Translate a text message into the requesting user's language (requires
        GEMINI_API_KEY)
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Not configured, not found, or not a participant
  /messaging/messages/{messageId}/forward:
    post:
      tags:
        - Messaging
      summary: Forward a message to another conversation you are a participant of
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
  /messaging/messages/{messageId}:
    patch:
      tags:
        - Messaging
      summary: Edit a text message you sent
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
    delete:
      tags:
        - Messaging
      summary: Delete a message for yourself, or for everyone (sender only, within 2
