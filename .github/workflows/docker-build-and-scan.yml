name: Docker build and scan






on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    name: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local/training-platform-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max



      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/training-platform-backend:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: inputs.push
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Push to GHCR
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max










      - name: Checkout training-platform-gitops
        if: inputs.push
        uses: actions/checkout@v7
        with:
          repository: YoussefAchraf/training-platform-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: dev
          path: gitops-bump

      - name: Bump backend image tag in training-platform-gitops
        if: inputs.push
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        working-directory: gitops-bump
        run: |
          set -e
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i 's/tag: "sha-[a-f0-9]*"/tag: "'"$TAG"'"/' environments/local-okd/backend-values.yaml
          if git diff --quiet; then
            echo "Already at $TAG, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-backend-image-$TAG"
          git checkout -b "$BRANCH"
          git add environments/local-okd/backend-values.yaml
          git commit -m "Bump backend image tag to $TAG

          Auto-opened after training-platform-backend's own CI pushed a
          new image. Source: youssefachraf/training-platform-backend@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --repo YoussefAchraf/training-platform-gitops --base dev --head "$BRANCH" \
            --title "Bump backend image tag to $TAG" \
            --body "Auto-opened after training-platform-backend's CI pushed ghcr.io/youssefachraf/training-platform-backend:$TAG. Auto-merges once dev's required checks pass. Source: youssefachraf/training-platform-backend@${{ github.sha }}"
          gh pr merge --repo YoussefAchraf/training-platform-gitops "$BRANCH" --auto --merge
