name: Verify





on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: npx tsc --noEmit





  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: npm audit (report only)
        run: npm audit --omit=dev || true
      - name: Outdated packages (informational)
        run: npm outdated || true





  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan (community rules, report only for now)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan --config=auto /src || true

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: training_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d training_platform"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/training_platform
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN: 8h
      REFRESH_TOKEN_TTL_DAYS: 30
      CLIENT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: npm run db:migrate
      - run: npm test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: training_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d training_platform"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/training_platform
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Lint migrations (data-safety rules)
        run: npm run db:lint
      - name: Existing migration files are immutable
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- src/infrastructure/database/migrations | grep -v -E '^A[[:space:]]' || true)
          if [ -n "$changed" ]; then
            echo "Applied migrations must never be modified, renamed or deleted. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi
      - name: Fresh install applies cleanly
        run: npm run db:migrate
      - name: Re-running is a no-op
        run: |
          npm run db:migrate | tee rerun.log
          grep -q "Database is up to date" rerun.log
      - run: npm run db:status
      - name: Prisma schema matches the migrated database
        run: npx ts-node scripts/checkPrismaDrift.ts

  upgrade-safety:
    name: upgrade-safety
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: training_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d training_platform"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/training_platform
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Check out the base branch (the schema production runs today)
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git worktree add ../base "origin/${{ github.base_ref }}"
      - name: Build the previous schema
        run: |
          if [ -d ../base/src/infrastructure/database/migrations ]; then
            MIGRATIONS_DIR=../base/src/infrastructure/database/migrations npm run db:migrate
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../base/src/infrastructure/database/schema.sql
          fi
      - name: Load sample data (includes legacy-shaped rows)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/db/sample-data.sql
      - name: Snapshot existing data
        run: npx ts-node scripts/dbSnapshot.ts capture --file "$RUNNER_TEMP/before.json"
      - name: Apply this branch's migrations
        run: npm run db:migrate
      - name: Existing data must be byte-for-byte unchanged
        run: npx ts-node scripts/dbSnapshot.ts compare --file "$RUNNER_TEMP/before.json"
