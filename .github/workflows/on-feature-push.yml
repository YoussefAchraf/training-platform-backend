name: On feature branch push






on:
  push:
    branches:
      - "feature/**"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  open-pr-to-dev:
    name: open-pr-to-dev
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open (or reuse) a PR into dev, and enable auto-merge
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base dev --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n1)
            gh pr create --repo "${{ github.repository }}" --base dev --head "$BRANCH" \
              --title "$TITLE" \
              --body "Auto-opened after verify passed on \`$BRANCH\`. Auto-merges once dev's required checks pass."
          fi
          gh pr merge "$BRANCH" --repo "${{ github.repository }}" --auto --merge || true
